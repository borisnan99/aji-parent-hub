function u8(b64){const pad='='.repeat((4-b64.length%4)%4);const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');const r=atob(s);const a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
// Ensures a push subscription exists AND is saved server-side whenever permission is granted.
// Self-healing: runs on every app open, so an already-granted device re-registers even if its row was lost.
async function syncPush(userId){
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||typeof Notification==='undefined') return 'unsupported'
  if(Notification.permission!=='granted') return 'not-granted'
  const reg=await navigator.serviceWorker.ready
  let sub=await reg.pushManager.getSubscription()
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID_PUBLIC)})
  const j=sub.toJSON()
  const {error}=await sb.from('push_subscriptions').upsert({user_id:userId,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_agent:navigator.userAgent},{onConflict:'endpoint'})
  return error?error.message:null
}
async function enablePush(userId){
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||typeof Notification==='undefined') return {error:'This browser doesn\u2019t support notifications.'}
  const perm=await Notification.requestPermission(); if(perm!=='granted') return {error:'Notifications were not allowed.'}
  try{const e=await syncPush(userId);return {error:(e&&e!=='not-granted'&&e!=='unsupported')?e:null}}catch(ex){return {error:String((ex&&ex.message)||ex)}}
}

function Login(){
  const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [err,setErr]=useState('');const [busy,setBusy]=useState(false)
  const [mode,setMode]=useState('signin');const [sent,setSent]=useState(false)
  async function go(){setBusy(true);setErr('');const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});setBusy(false);if(error)setErr(error.message)}
  async function sendReset(){if(!email.trim()){setErr('Enter your email address first');return}setBusy(true);setErr('')
    try{await sb.functions.invoke('password-reset',{body:{email:email.trim()}})}catch(e){}
    setBusy(false);setSent(true)}
  return html`<div class="center"><div style=${{width:'100%',maxWidth:380,textAlign:'center'}}>
    <img src="/logo.png" alt="Al Jamiatul Islamiyah — Bolton Darul Uloom" style=${{width:'min(300px,76vw)',height:'auto',margin:'0 auto',display:'block'}}/>
    <div class="muted" style=${{fontSize:10,letterSpacing:'.22em',fontWeight:600,marginTop:8}}>SCHOOL COMMUNICATION PORTAL</div>
    <div class="card" style=${{padding:20,marginTop:22,textAlign:'left'}}>
      ${mode==='signin'?html`<div>
        <div class="lbl">Email</div><input class="in" value=${email} onInput=${e=>setEmail(e.target.value)} placeholder="you@example.com"/>
        <div class="lbl" style=${{marginTop:12}}>Password</div><input class="in" type="password" value=${pw} onInput=${e=>setPw(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&go()}/>
        ${err&&html`<div style=${{color:C.urgent,fontSize:13,marginTop:10}}>${err}</div>`}
        <button class="btn" style=${{marginTop:16}} disabled=${busy} onClick=${go}>${busy?'Signing in…':'Sign in'}</button>
        <div style=${{textAlign:'center',marginTop:12}}><button onClick=${()=>{setMode('reset');setErr('');setSent(false)}} style=${{background:'none',border:'none',color:C.navy,textDecoration:'underline',fontSize:12,cursor:'pointer'}}>Forgot password?</button></div>
      </div>`:sent?html`<div style=${{textAlign:'center'}}>
        <div style=${{fontSize:34}}>📧</div>
        <h3 class="serif" style=${{color:C.navy,margin:'6px 0'}}>Check your email</h3>
        <p style=${{fontSize:13,color:C.muted}}>If an account exists for <b>${email.trim()}</b>, we've sent a link to reset your password. Open it on this device, then choose a new password. The link expires after a while.</p>
        <button class="btn ghost" style=${{marginTop:10}} onClick=${()=>{setMode('signin');setSent(false)}}>Back to sign in</button>
      </div>`:html`<div>
        <h3 class="serif" style=${{color:C.navy,margin:'0 0 4px'}}>Reset your password</h3>
        <p style=${{fontSize:12,color:C.muted,marginTop:0}}>Enter your email and we'll send you a link to set a new password.</p>
        <div class="lbl">Email</div><input class="in" value=${email} onInput=${e=>setEmail(e.target.value)} placeholder="you@example.com" onKeyDown=${e=>e.key==='Enter'&&sendReset()}/>
        ${err&&html`<div style=${{color:C.urgent,fontSize:13,marginTop:10}}>${err}</div>`}
        <button class="btn" style=${{marginTop:16}} disabled=${busy} onClick=${sendReset}>${busy?'Sending…':'Send reset link'}</button>
        <div style=${{textAlign:'center',marginTop:12}}><button onClick=${()=>{setMode('signin');setErr('')}} style=${{background:'none',border:'none',color:C.navy,textDecoration:'underline',fontSize:12,cursor:'pointer'}}>Back to sign in</button></div>
      </div>`}
    </div>
    <div class="muted" style=${{fontSize:11,marginTop:14}}>Your details are private and never shared with other parents.</div>
  </div></div>`}

function ResetPassword({onDone}){
  const [pw,setPw]=useState('');const [pw2,setPw2]=useState('');const [err,setErr]=useState('');const [busy,setBusy]=useState(false);const [done,setDone]=useState(false)
  async function save(){if(pw.length<8){setErr('Use at least 8 characters');return}if(pw!==pw2){setErr('The two passwords do not match');return}setBusy(true);setErr('')
    const {error}=await sb.auth.updateUser({password:pw});setBusy(false);if(error){setErr(error.message);return}
    try{history.replaceState(null,'',window.location.pathname)}catch(e){};setDone(true)}
  return html`<div class="center"><div style=${{width:'100%',maxWidth:380,textAlign:'center'}}>
    <img src="/logo.png" alt="Al Jamiatul Islamiyah" style=${{width:'min(260px,70vw)',height:'auto',margin:'0 auto',display:'block'}}/>
    <div class="card" style=${{padding:20,marginTop:20,textAlign:'left'}}>
      ${done?html`<div style=${{textAlign:'center'}}><div style=${{fontSize:34}}>✅</div><h3 class="serif" style=${{color:C.navy,margin:'6px 0'}}>Password updated</h3>
        <p style=${{fontSize:13,color:C.muted}}>Your new password is set. You're now signed in.</p>
        <button class="btn" style=${{marginTop:8}} onClick=${onDone}>Continue</button></div>`:html`<div>
        <h3 class="serif" style=${{color:C.navy,margin:'0 0 4px'}}>Set a new password</h3>
        <p style=${{fontSize:12,color:C.muted,marginTop:0}}>Choose a new password for your account.</p>
        <div class="lbl" style=${{marginTop:8}}>New password</div><input class="in" type="password" value=${pw} onInput=${e=>setPw(e.target.value)} placeholder="At least 8 characters"/>
        <div class="lbl" style=${{marginTop:12}}>Confirm new password</div><input class="in" type="password" value=${pw2} onInput=${e=>setPw2(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&save()}/>
        ${err&&html`<div style=${{color:C.urgent,fontSize:13,marginTop:10}}>${err}</div>`}
        <button class="btn" style=${{marginTop:16}} disabled=${busy} onClick=${save}>${busy?'Saving…':'Save new password'}</button>
      </div>`}
    </div>
  </div></div>`}

function NotifyCard({userId,fire}){
  const [state,setState]=useState(typeof Notification!=='undefined'?Notification.permission:'unsupported')
  const [canInstall,setCanInstall]=useState(!!deferredPrompt);const [showHow,setShowHow]=useState(false)
  useEffect(()=>{const h=()=>setCanInstall(true);window.addEventListener('caninstall',h);return()=>window.removeEventListener('caninstall',h)},[])
  useEffect(()=>{if(userId&&typeof Notification!=='undefined'&&Notification.permission==='granted')syncPush(userId)},[userId])
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone
  async function enable(){const {error}=await enablePush(userId);if(error)fire(error);else{setState('granted');fire('Notifications enabled on this device')}}
  async function test(){const {data,error}=await sb.functions.invoke('send-announcement',{body:{mode:'test'}});fire(error?('Error: '+error.message):(data&&data.pushed?'Test notification sent — check your device':'No device subscribed yet'))}
  async function install(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;setCanInstall(false)}}
  return html`<div class="card" style=${{padding:14,marginBottom:14,background:'#fff'}}>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <div><b>Notifications</b><div class="muted" style=${{fontSize:11}}>${state==='granted'?'On for this device':'Free instant alerts (no WhatsApp)'}</div></div>
      <div style=${{display:'flex',gap:8}}>
        ${state!=='granted'&&html`<button class="btn ghost" style=${{width:'auto',padding:'8px 12px',fontSize:13}} onClick=${enable}>Enable</button>`}
        ${state==='granted'&&html`<button class="btn ghost" style=${{width:'auto',padding:'8px 12px',fontSize:13}} onClick=${test}>Send test</button>`}
      </div>
    </div>
    ${!standalone&&html`<div style=${{marginTop:10}}>
      ${canInstall?html`<button class="btn gold" style=${{width:'100%'}} onClick=${install}>📲 Install app on this device</button>`:html`<button class="btn gold" style=${{width:'100%'}} onClick=${()=>setShowHow(h=>!h)}>📲 Add to home screen${showHow?' ▲':' ▼'}</button>`}
      ${(showHow||isIOS)&&!canInstall&&html`<div class="muted" style=${{fontSize:12,marginTop:8,lineHeight:1.55}}>
        <b style=${{color:C.navy}}>iPhone (Safari):</b> tap <b>Share</b> ⬆️ at the bottom, then <b>Add to Home Screen</b>.<br/>
        <b style=${{color:C.navy}}>Android (Chrome):</b> tap the <b>⋮ menu</b> (top-right), then <b>Install app</b> / <b>Add to Home screen</b>.<br/>
        <span style=${{color:C.urgent,fontWeight:600}}>Opened this from WhatsApp or email?</span> First open <b>aji-parent-hub.vercel.app</b> in Safari (iPhone) or Chrome (Android), then follow the steps above.
      </div>`}
    </div>`}
  </div>`}

function PupilEditor({pupil,classes,onClose,onSaved}){
  const isNew=!pupil.id
  const [fn,setFn]=useState(pupil.first_name||'');const [ln,setLn]=useState(pupil.last_name||'')
  const [adm,setAdm]=useState(pupil.admission_no||'');const [yr,setYr]=useState(pupil.academic_year||'Year 7')
  const [mc,setMc]=useState(pupil.morning_class||(classes[0]&&classes[0].name)||'')
  const [bs,setBs]=useState(pupil.boarding_status||'Boarding');const [active,setActive]=useState(pupil.is_active!==false)
  const [busy,setBusy]=useState(false);const [err,setErr]=useState('')
  const [guardians,setGuardians]=useState(null);const [pEmail,setPEmail]=useState('');const [pName,setPName]=useState('');const [pBusy,setPBusy]=useState(false);const [pMsg,setPMsg]=useState('')
  async function loadGuardians(){if(isNew||!pupil.id)return;const {data}=await sb.from('parent_pupil').select('is_primary,profiles(id,full_name,email)').eq('pupil_id',pupil.id);setGuardians((data||[]).map(r=>({...(r.profiles||{}),is_primary:r.is_primary})).filter(g=>g.id).sort((a,b)=>(b.is_primary?1:0)-(a.is_primary?1:0)))}
  useEffect(()=>{loadGuardians()},[])
  async function addParent(){const em=pEmail.trim();if(!em||!em.includes('@')){setPMsg('Enter a valid email');return}setPBusy(true);setPMsg('')
    const {data,error}=await sb.functions.invoke('add-parent',{body:{pupil_id:pupil.id,email:em,name:pName.trim()||null}});setPBusy(false)
    if(error||(data&&data.error)){setPMsg((data&&data.error)||(error&&error.message)||'Error');return}
    setPMsg(data.created?'Added — invite emailed ✓':'Linked to this child ✓');setPEmail('');setPName('');loadGuardians()}
  const YEARS=['Year 7','Year 8','Year 9','Year 10','Year 11','Post-16','Over-18']
  async function save(){
    if(!fn.trim()||!ln.trim()){setErr('First and last name are required');return}
    setBusy(true);setErr('')
    const payload={first_name:fn.trim(),last_name:ln.trim(),admission_no:adm.trim()||null,academic_year:yr,morning_class:mc,boarding_status:bs,is_active:active}
    let pid=pupil.id
    if(isNew){const {data,error}=await sb.from('pupils').insert(payload).select('id').single();if(error){setBusy(false);setErr(error.message);return}pid=data.id}
    else{const {error}=await sb.from('pupils').update(payload).eq('id',pid);if(error){setBusy(false);setErr(error.message);return}}
    if(!active){await sb.from('class_enrolments').delete().eq('pupil_id',pid)}
    else{const cls=classes.find(c=>c.name===mc)
    if(cls){const {data:ex}=await sb.from('class_enrolments').select('class_id').eq('pupil_id',pid)
      if(ex&&ex.length){if(ex[0].class_id!==cls.id)await sb.from('class_enrolments').update({class_id:cls.id}).eq('pupil_id',pid)}
      else await sb.from('class_enrolments').insert({class_id:cls.id,pupil_id:pid})}}
    setBusy(false);onSaved(isNew?'Pupil added':(active?'Pupil updated':'Taken off roll & removed from class'))}
  return html`<div style=${{position:'fixed',inset:0,background:'rgba(10,18,35,.55)',display:'flex',alignItems:'flex-end',justifyContent:'center',zIndex:50}} onClick=${onClose}>
    <div class="card" style=${{background:'#fff',width:'100%',maxWidth:560,borderRadius:'18px 18px 0 0',padding:18,maxHeight:'88vh',overflowY:'auto'}} onClick=${e=>e.stopPropagation()}>
      <h2 class="serif" style=${{color:C.navy,margin:'2px 0 12px'}}>${isNew?'Add pupil':'Edit pupil'}</h2>
      <div style=${{display:'flex',gap:10}}>
        <div style=${{flex:1}}><div class="lbl">First name</div><input class="in" value=${fn} onInput=${e=>setFn(e.target.value)}/></div>
        <div style=${{flex:1}}><div class="lbl">Last name</div><input class="in" value=${ln} onInput=${e=>setLn(e.target.value)}/></div></div>
      <div class="lbl" style=${{marginTop:12}}>Admission no.</div><input class="in" value=${adm} onInput=${e=>setAdm(e.target.value)} placeholder="e.g. 9240123"/>
      <div class="lbl" style=${{marginTop:12}}>School year</div>
      <select class="in" value=${yr} onChange=${e=>setYr(e.target.value)}>${YEARS.map(y=>html`<option key=${y} value=${y}>${y}</option>`)}</select>
      <div class="lbl" style=${{marginTop:12}}>Morning class</div>
      <select class="in" value=${mc} onChange=${e=>setMc(e.target.value)}>${classes.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>html`<option key=${c.id} value=${c.name}>${c.name}</option>`)}</select>
      <div class="lbl" style=${{marginTop:12}}>Boarding status</div>
      <div style=${{display:'flex',gap:8,marginTop:6}}>${['Boarding','Commuter'].map(b=>html`<button key=${b} class="chip ${bs===b?'on':''}" style=${{flex:1}} onClick=${()=>setBs(b)}>${b}</button>`)}</div>
      ${!isNew&&html`<div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:14}}>
        <div><b>On roll</b><div class="muted" style=${{fontSize:11}}>Turn off if the pupil has left</div></div>
        <button class="chip ${active?'on':''}" onClick=${()=>setActive(a=>!a)}>${active?'On roll':'Left'}</button></div>`}
      ${!isNew&&html`<div style=${{marginTop:16,borderTop:'1px solid '+C.line,paddingTop:14}}>
        <div class="lbl" style=${{marginBottom:6}}>Parents / Guardians</div>
        ${guardians===null?html`<div class="muted" style=${{fontSize:12}}>Loading…</div>`:guardians.length===0?html`<div class="muted" style=${{fontSize:12}}>No parents linked yet.</div>`:guardians.map(g=>html`<div key=${g.id} class="card" style=${{padding:'8px 10px',marginBottom:6,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
          <div style=${{minWidth:0}}><b style=${{fontSize:13}}>${g.full_name||'Parent'}</b><div class="muted" style=${{fontSize:11,wordBreak:'break-all'}}>${g.email}</div></div>
          ${g.is_primary?html`<span class="tag" style=${{background:C.goldSoft,color:C.navy,flexShrink:0}}>Preferred</span>`:''}</div>`)}
        <div class="lbl" style=${{marginTop:10}}>Add another parent (e.g. the mother)</div>
        <input class="in" type="email" placeholder="Parent's email" value=${pEmail} onInput=${e=>setPEmail(e.target.value)}/>
        <input class="in" placeholder="Parent's name (optional)" value=${pName} onInput=${e=>setPName(e.target.value)} style=${{marginTop:6}}/>
        <button class="btn" style=${{marginTop:8,width:'100%'}} disabled=${pBusy} onClick=${addParent}>${pBusy?'Adding…':'Add & send invite'}</button>
        ${pMsg&&html`<div style=${{fontSize:12,marginTop:6,color:pMsg.indexOf('✓')>=0?C.green:C.urgent}}>${pMsg}</div>`}
      </div>`}
      ${err&&html`<div style=${{color:C.urgent,fontSize:13,marginTop:10}}>${err}</div>`}
      <div style=${{display:'flex',gap:8,marginTop:18}}>
        <button class="btn ghost" style=${{flex:1}} onClick=${onClose}>Cancel</button>
        <button class="btn gold" style=${{flex:1}} disabled=${busy} onClick=${save}>${busy?'Saving…':(isNew?'Add pupil':'Save changes')}</button></div>
    </div></div>`}

function Leaderboard({profile}){
  const [range,setRange]=useState('week');const [data,setData]=useState(null);const [meta,setMeta]=useState({})
  const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
  function bounds(r){const now=new Date()
    if(r==='week'){const day=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-day);const fri=new Date(mon);fri.setDate(mon.getDate()+4);return [iso(mon),iso(fri)]}
    const [yy,mm]=r.split('-').map(Number);const first=new Date(yy,mm-1,1);const last=new Date(yy,mm,0);return [iso(first),iso(last)]}
  function monthOpts(){const now=new Date();const o=[];let y=2026,m=8;while(y<now.getFullYear()||(y===now.getFullYear()&&m<=now.getMonth())){o.push([y+'-'+String(m+1).padStart(2,'0'),new Date(y,m,1).toLocaleDateString('en-GB',{month:'short'})]);m++;if(m>11){m=0;y++}}return o}
  async function fetchAll(from,to){let all=[],off=0;while(true){const {data,error}=await sb.from('attendance').select('class_id,pupil_id,status,on_date,phase').in('phase',['morning','afternoon']).gte('on_date',from).lte('on_date',to).range(off,off+999);if(error||!data||!data.length)break;all=all.concat(data);if(data.length<1000)break;off+=1000}return all}
  async function load(){setData(null)
    const [from,to]=bounds(range)
    const [{data:cls},{data:pus},att]=await Promise.all([
      sb.from('classes').select('id,name').eq('phase','morning'),
      sb.from('pupils').select('id,academic_year'),
      fetchAll(from,to)])
    const cmap={};(cls||[]).forEach(c=>cmap[c.id]=c.name)
    const ymap={};(pus||[]).forEach(p=>ymap[p.id]=p.academic_year)
    // Morning-CLASS league: per morning mark, keeps lateness
    const cAgg={};att.forEach(a=>{if(a.phase!=='morning'||!a.class_id)return;const g=cAgg[a.class_id]=cAgg[a.class_id]||{present:0,late:0,absent:0,excused:0,marks:0};g.marks++;if(a.status in g)g[a.status]++})
    const clsRows=Object.keys(cAgg).map(cid=>{const g=cAgg[cid];return {name:cmap[cid]||'Class',late:g.late,absent:g.absent,marks:g.marks,pct:g.marks?Math.round((g.present+g.late)/g.marks*100):0}}).filter(x=>x.marks>0).sort((a,b)=>b.pct-a.pct||a.late-b.late||a.name.localeCompare(b.name))
    // Year 7-11 league: OVERALL daily attendance — present if in ANY session that day; no lateness
    const YEARS=['Year 7','Year 8','Year 9','Year 10','Year 11']
    const day={};att.forEach(a=>{const y=ymap[a.pupil_id];if(!YEARS.includes(y))return;const k=a.pupil_id+'|'+a.on_date;const d=day[k]=day[k]||{y,att:false,exc:false};if(a.status==='present'||a.status==='late')d.att=true;if(a.status==='excused')d.exc=true})
    const yAgg={};Object.values(day).forEach(d=>{const g=yAgg[d.y]=yAgg[d.y]||{present:0,absent:0,excused:0,days:0};g.days++;if(d.att)g.present++;else if(d.exc)g.excused++;else g.absent++})
    const yrRows=YEARS.filter(y=>yAgg[y]).map(y=>{const g=yAgg[y];return {name:y,present:g.present,absent:g.absent,days:g.days,pct:g.days?Math.round(g.present/g.days*100):0}}).sort((a,b)=>b.pct-a.pct||a.name.localeCompare(b.name))
    setData({yr:yrRows,cls:clsRows});setMeta({from,to})}
  useEffect(()=>{load()},[range])
  const fmt=s=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'
  const bar=pct=>html`<div style=${{height:6,background:C.line,borderRadius:99,marginTop:6,overflow:'hidden'}}><div style=${{height:'100%',width:pct+'%',background:`linear-gradient(90deg,${C.gold},${C.goldSoft})`}}></div></div>`
  const row=(r,i,detail)=>html`<div key=${r.name} class="card" style=${{padding:'8px 9px',marginBottom:6}}>
    <div style=${{display:'flex',alignItems:'center',gap:5}}><span style=${{fontSize:12,fontWeight:700,color:C.muted,minWidth:16}}>${medal(i)}</span><b style=${{flex:1,fontSize:13,lineHeight:1.15,minWidth:0,wordBreak:'break-word'}}>${r.name}</b><b style=${{fontSize:13,color:C.navy}}>${r.pct}%</b></div>
    ${bar(r.pct)}<div style=${{fontSize:10,marginTop:4,color:detail.warn?C.urgent:C.muted}}>${detail.text}</div></div>`
  const emptyCol=html`<div class="muted" style=${{fontSize:12}}>No marks in this period yet.</div>`
  return html`<div>
    <div style=${{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>${[['week','This week'],...monthOpts()].map(([k,l])=>html`<button key=${k} class="chip ${range===k?'on':''}" onClick=${()=>setRange(k)}>${l}</button>`)}</div>
    ${data===null?html`<div class="muted">Crunching the numbers…</div>`:html`<div>
      <div class="muted" style=${{fontSize:11,marginBottom:4}}>${fmt(meta.from)} – ${fmt(meta.to)}</div>
      <div class="muted" style=${{fontSize:10,marginBottom:10,lineHeight:1.3}}>Year 7–11 = overall daily attendance (present if in <b>any</b> session). Classes = morning register.</div>
      <div style=${{display:'flex',gap:10}}>
        <div style=${{flex:1,minWidth:0}}><div class="lbl" style=${{marginBottom:6,color:C.navy}}>🎓 Year 7–11</div>
          ${data.yr.length===0?emptyCol:data.yr.map((r,i)=>row(r,i,{text:`${r.present}/${r.days} days present`,warn:false}))}</div>
        <div style=${{flex:1,minWidth:0}}><div class="lbl" style=${{marginBottom:6,color:C.navy}}>📖 Morning classes</div>
          ${data.cls.length===0?emptyCol:data.cls.map((r,i)=>row(r,i,r.late>0?{text:`⏰ ${r.late} late · ${r.absent} abs`,warn:true}:{text:`${r.absent} absent`,warn:false}))}</div>
      </div>
    </div>`}
  </div>`}

function PraiseGrid({assignment,period,onBack}){
  const [d,setD]=useState(null);const [vals,setVals]=useState({});const [busy,setBusy]=useState(false);const [toast,setToast]=useState('')
  const fire=m=>{setToast(m);setTimeout(()=>setToast(''),2600)}
  useEffect(()=>{(async()=>{const {data}=await sb.functions.invoke('praise-entry',{body:{action:'load',assignment_id:assignment.id,period}});if(data&&data.ok){setD(data);const v={};(data.pupils||[]).forEach(p=>{if(data.existing[p.id]!=null)v[p.id]=String(data.existing[p.id])});setVals(v)}else fire((data&&data.error)||'Error')})()},[])
  if(!d)return html`<div class="muted">Loading pupils…</div>`
  const ro=d.finalised
  function setV(id,x){x=x.replace(/[^0-9.]/g,'');if(x!==''&&parseFloat(x)>10)x='10';setVals(v=>({...v,[id]:x}))}
  async function save(){setBusy(true)
    const scores=Object.entries(vals).filter(([_,x])=>x!==''&&x!=null).map(([pupil_id,x])=>({pupil_id,points:parseFloat(x)}))
    const {data}=await sb.functions.invoke('praise-entry',{body:{action:'save',assignment_id:assignment.id,period,scores}})
    setBusy(false);fire(data&&data.ok?('Saved ✓ '+data.saved+' scores'):((data&&data.error)||'Error saving'))}
  const done=d.pupils.filter(p=>vals[p.id]!==undefined&&vals[p.id]!=='').length
  return html`<div>
    <div style=${{display:'flex',gap:8,alignItems:'center',marginBottom:8}}><button class="chip" onClick=${onBack}>← Classes</button><b>${assignment.group_value}</b><span class="muted" style=${{fontSize:11}}>${assignment.context==='school'?'School':'Madrasah'}</span></div>

    <div class="muted" style=${{fontSize:11,marginBottom:8}}>Score each pupil out of 10. ${done}/${d.pupils.length} done. Blank = not scored yet.</div>
    ${d.pupils.length===0&&html`<div class="card muted" style=${{padding:16}}>No active pupils in this class.</div>`}
    ${d.pupils.map(p=>html`<div key=${p.id} class="card" style=${{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',marginBottom:6}}>

      <input class="in" style=${{marginTop:0,width:74,textAlign:'center',fontWeight:700}} inputmode="decimal" disabled=${ro} value=${vals[p.id]||''} placeholder="–" onInput=${e=>setV(p.id,e.target.value)}/></div>`)}
    ${!ro&&d.pupils.length>0&&html`<button class="btn" style=${{marginTop:8}} disabled=${busy} onClick=${save}>${busy?'Saving…':'Save scores'}</button>`}
    ${toast&&html`<div style=${{position:'fixed',left:'50%',bottom:24,transform:'translateX(-50%)',background:'#0E1D38',color:'#fff',padding:'10px 16px',borderRadius:999,fontSize:14}}>${toast}</div>`}
  </div>`}

function BoardingRooms({profile,fire}){

    ${mode==='log'&&html`<div>

          ${q&&html`<div style=${{marginTop:6}}>${list.length?list.map(p=>html`<div key=${p.id} class="card" style=${{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',marginBottom:6,cursor:'pointer'}} onClick=${()=>{setSel(p);setQ('')}}><b>${p.first_name} ${p.last_name}</b><span class="muted" style=${{fontSize:11}}>${p.academic_year||''}</span></div>`):html`<div class="muted" style=${{fontSize:12}}>No match</div>`}</div>`}

          <button class="btn" style=${{marginTop:12}} disabled=${busy||!period||!code||!(reason==='Other'?reasonOther.trim():reason)} onClick=${submitLog}>${busy?'Sending…':'Log C code & send to Yasin'}</button>

        <div class="muted" style=${{fontSize:11,marginTop:2}}>${fmt(i.created_at)}${i.detention?' · Detention '+i.detention.detention_date:''}</div>

    </div>`}

    ${mode==='review'&&canReview&&html`<div>
      ${queue.length===0&&html`<div class="card muted" style=${{padding:16}}>Nothing to review right now.</div>`}

const SUP_ROOM_CHECKS=['Cleanliness','Window Sills','Lights','Storage Units','Beddings','Sockets','Showers and Toilets','Fire Extinguishers','Emergency Lights','Fire Escape Routes','Students settled in their rooms by lights out','Corridors and fire exits clear']
const SUP_SUPERVISORS=['Zubair Patel','Gulfam Khan','Yasin Patel','Ihsaanul Haque','Omar Sher','Luqman Amla']
function canSupervisor(p){if(!p)return false;if(p.role==='admin')return true;const em=(p.email||'').toLowerCase(),nm=(p.full_name||'').trim().toLowerCase();return ['gulfam khan','zubair patel'].includes(nm)||['gulfam.khan@boltondarululoom.org.uk','zubair.patel@boltondarululoom.org.uk'].includes(em)}

function Supervisor({profile}){
  const today=new Date().toISOString().slice(0,10)
  const [date,setDate]=useState(today);const [name,setName]=useState(SUP_SUPERVISORS.includes(profile.full_name)?profile.full_name:'')
  const [shift,setShift]=useState('');const [arrived,setArrived]=useState('');const [lightsOut,setLightsOut]=useState('')
  const [checks,setChecks]=useState([]);const [secured,setSecured]=useState(false);const [timeSecured,setTimeSecured]=useState('')
  const [welfare,setWelfare]=useState('');const [maint,setMaint]=useState('');const [important,setImportant]=useState('')
  const [rows,setRows]=useState(null);const [busy,setBusy]=useState(false);const [toast,setToast]=useState('')
  const fire=m=>{setToast(m);setTimeout(()=>setToast(''),3600)}
  async function loadRows(){const {data}=await sb.functions.invoke('supervisor-checklist',{body:{action:'list'}});setRows((data&&data.rows)||[])}
  useEffect(()=>{loadRows()},[])
  function toggleCheck(it){setChecks(c=>c.includes(it)?c.filter(x=>x!==it):c.concat(it))}
  async function submit(){if(!name){fire('Choose the supervisor');return}if(!shift){fire('Choose Day or Night');return}
    setBusy(true)
    const {data,error}=await sb.functions.invoke('supervisor-checklist',{body:{action:'save',check_date:date,supervisor_name:name,shift,arrived_at:arrived,lights_out:lightsOut,room_checks:checks,final_secured:secured,time_secured:timeSecured,welfare_incidents:welfare,maintenance_notes:maint,important_info:important}})
    setBusy(false)
    if(error||(data&&data.error)){fire((data&&data.error)||'Error saving');return}
    fire('Checklist saved')
    setShift('');setArrived('');setLightsOut('');setChecks([]);setSecured(false);setTimeSecured('');setWelfare('');setMaint('');setImportant('');loadRows()}
  async function exportCsv(){const {data,error}=await sb.functions.invoke('supervisor-checklist',{body:{action:'export',month:date.slice(0,7)}})

    </div>`}
    ${mode==='triage'&&html`<div>

        return html`<div key=${sl.slot} class="card" style=${{padding:'10px 12px',marginTop:8}}>

            <div class="lbl" style=${{marginTop:8}}>Who took them</div><input class="in" value=${dft.taken_by!==undefined?dft.taken_by:(b.taken_by||'')} onInput=${e=>setOd(o=>({...o,[b.id]:{...(o[b.id]||{}),taken_by:e.target.value}}))}/>
            <div class="lbl" style=${{marginTop:8}}>Update / outcome</div><textarea class="in" style=${{minHeight:44,resize:'vertical',fontFamily:'inherit'}} value=${dft.outcome!==undefined?dft.outcome:(b.outcome||'')} onInput=${e=>setOd(o=>({...o,[b.id]:{...(o[b.id]||{}),outcome:e.target.value}}))}></textarea>
            <div style=${{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
              <button class="chip" style=${{background:(dft.pn!==undefined?dft.pn:b.parent_notified)?C.green:'',color:(dft.pn!==undefined?dft.pn:b.parent_notified)?'#fff':''}} onClick=${()=>setOd(o=>({...o,[b.id]:{...(o[b.id]||{}),pn:!(dft.pn!==undefined?dft.pn:b.parent_notified)}}))}>${(dft.pn!==undefined?dft.pn:b.parent_notified)?'✓ ':''}Parent notified</button>

    ${toast&&html`<div style=${{position:'fixed',left:'50%',bottom:24,transform:'translateX(-50%)',background:'#0E1D38',color:'#fff',padding:'10px 16px',borderRadius:999,fontSize:14,maxWidth:'90%',textAlign:'center'}}>${toast}</div>`}

function canKitchen(p){if(!p)return false;if(p.role==='admin')return true;return ['kulsum'].some(k=>(p.full_name||'').toLowerCase().includes(k))}
const kToday=()=>new Date().toLocaleDateString('en-CA')
function fridgeTag(n){if(n==null||n==='')return null;n=Number(n);return n>8?{bg:C.urgentSoft,fg:C.urgent,l:'Over 8°C — action'}:n>5?{bg:'#FBECC9',fg:'#8A6D1B',l:'Slightly high'}:{bg:'#E5EEE7',fg:C.green,l:'OK ≤5°C'}}
function freezerTag(n){if(n==null||n==='')return null;n=Number(n);return n>-15?{bg:C.urgentSoft,fg:C.urgent,l:'Too warm — action'}:n>-18?{bg:'#FBECC9',fg:'#8A6D1B',l:'Slightly high'}:{bg:'#E5EEE7',fg:C.green,l:'OK ≤−18°C'}}

function Kitchen({profile}){

function KitchenDaily({profile,fire}){
  const [date,setDate]=useState(kToday());const [day,setDay]=useState(null);const [temps,setTemps]=useState([]);const [busy,setBusy]=useState(false)
  const [o,setO]=useState({fridge:'',freezer:'',safe:false,notes:''});const [c,setC]=useState({fridge:'',freezer:'',safe:false,notes:''})
  const [extra,setExtra]=useState('');const [tk,setTk]=useState('cooking');const [ti,setTi]=useState('');const [tt,setTt]=useState('')
  async function load(){const {data}=await sb.functions.invoke('kitchen',{body:{action:'daily_load',date}});if(data&&data.ok){const d=data.day;setDay(d);setTemps(data.temps||[])
    setO({fridge:d&&d.open_fridge!=null?d.open_fridge:'',freezer:d&&d.open_freezer!=null?d.open_freezer:'',safe:!!(d&&d.open_safe_methods),notes:(d&&d.open_notes)||''})
    setC({fridge:d&&d.close_fridge!=null?d.close_fridge:'',freezer:d&&d.close_freezer!=null?d.close_freezer:'',safe:!!(d&&d.close_safe_methods),notes:(d&&d.close_notes)||''})
    setExtra((d&&d.extra_checks)||'')}}
  useEffect(()=>{load()},[date])
  const catered=!!(day&&day.catered)
  async function saveCheck(which){setBusy(true);const s=which==='daily_open'?o:c;const {data,error}=await sb.functions.invoke('kitchen',{body:{action:which,date,fridge:s.fridge,freezer:s.freezer,safe_methods:s.safe,notes:s.notes}});setBusy(false);if(error||(data&&data.error)){fire((data&&data.error)||'Error');return}fire('Saved');load()}
  async function setCatered(v){const {data}=await sb.functions.invoke('kitchen',{body:{action:'daily_meta',date,catered:v}});if(data&&data.ok){fire(v?'Marked catered — checks not required':'Checks required');load()}}
  async function saveExtra(){const {data}=await sb.functions.invoke('kitchen',{body:{action:'daily_meta',date,extra_checks:extra}});if(data&&data.ok)fire('Saved')}
  async function addTemp(){if(!ti||tt===''){fire('Add an item and temperature');return}const {data,error}=await sb.functions.invoke('kitchen',{body:{action:'temp_add',date,kind:tk,item:ti,temp:tt}});if(error||(data&&data.error)){fire((data&&data.error)||'Error');return}setTi('');setTt('');load()}
  async function delTemp(id){await sb.functions.invoke('kitchen',{body:{action:'temp_delete',id}});load()}
  async function exportMonth(){const {data}=await sb.functions.invoke('kitchen',{body:{action:'month_export',month:date.slice(0,7)}});if(!data||!data.ok){fire('Export failed');return}
    const rows=[['Kitchen daily diary — '+date.slice(0,7)],['Date','Catered','Open fridge','Open freezer','Open safe methods','Opened by','Close fridge','Close freezer','Close safe methods','Closed by','Notes']]
    ;(data.days||[]).forEach(d=>rows.push([d.log_date,d.catered?'Yes':'',d.open_fridge??'',d.open_freezer??'',d.open_safe_methods?'Yes':'',d.open_by_name||'',d.close_fridge??'',d.close_freezer??'',d.close_safe_methods?'Yes':'',d.close_by_name||'',[d.open_notes,d.close_notes].filter(Boolean).join(' / ')]))
    rows.push([]);rows.push(['Cooking / reheating temperatures']);rows.push(['Date','Type','Item','°C','Pass'])
    ;(data.temps||[]).forEach(t=>rows.push([t.log_date,t.kind,t.item||'',t.temp_c,t.pass===true?'Pass':t.pass===false?'FAIL':'']))
    const csv=rows.map(r=>r.map(x=>'"'+(x==null?'':x).toString().replace(/"/g,'""')+'"').join(',')).join(String.fromCharCode(10))
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='kitchen_diary_'+date.slice(0,7)+'.csv';a.click();URL.revokeObjectURL(url)}
  async function printMonth(){
    const month=date.slice(0,7)
    const {data}=await sb.functions.invoke('kitchen',{body:{action:'month_export',month}})
    if(!data||!data.ok){fire('Could not load month');return}
    const isod=x=>new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)
    const dayMap={};(data.days||[]).forEach(d=>dayMap[d.log_date]=d)
    const tempMap={};(data.temps||[]).forEach(t=>{(tempMap[t.log_date]=tempMap[t.log_date]||[]).push(t)})
    const [y,m]=month.split('-').map(Number);const last=new Date(y,m,0).getDate()
    const wk={};for(let i=1;i<=last;i++){const dt=new Date(y,m-1,i);const dow=(dt.getDay()+6)%7;const mon=new Date(dt);mon.setDate(dt.getDate()-dow);const key=isod(mon);(wk[key]=wk[key]||[]).push(dt)}
    const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    const monthLbl=new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})
    const cell=dt=>{const d=dayMap[isod(dt)]||{}
      const temps=(tempMap[isod(dt)]||[]).map(t=>esc(t.item)+' '+t.temp_c+'°C'+(t.pass===false?' (FAIL)':'')).join(', ')
      const probs=[d.open_notes,d.close_notes].filter(Boolean).map(esc).join(' / ')
      const fr=(d.open_fridge!=null||d.close_fridge!=null)?('Fridge '+(d.open_fridge!=null?d.open_fridge:'–')+(d.close_fridge!=null?' / '+d.close_fridge:'')+'°C'):''
      const fz=(d.open_freezer!=null||d.close_freezer!=null)?('Freezer '+(d.open_freezer!=null?d.open_freezer:'–')+(d.close_freezer!=null?' / '+d.close_freezer:'')+'°C'):''
      const name=d.open_by_name||d.close_by_name||''
      return '<div class="cell"><div class="dh">'+dt.toLocaleDateString('en-GB',{weekday:'long'})+' <span>'+dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</span></div>'+
        (d.catered?'<div class="catered">Catered / no food prepared</div>':
        '<div class="q">Any problems or changes – what did you do?</div><div class="ans">'+(probs||'')+'</div>'+
        '<div class="temps">'+[fr,fz,temps?('Cooking: '+temps):''].filter(Boolean).join(' · ')+'</div>'+
        '<div class="checks"><span>Opening '+(d.open_safe_methods?'☑':'☐')+'</span><span>Closing '+(d.close_safe_methods?'☑':'☐')+'</span></div>'+
        '<div class="sign">Name: '+esc(name)+' &nbsp; Signed: ______</div>'+
        '<div class="safe">Our safe methods were followed and effectively supervised today.</div>')+'</div>'}
    const weeksHtml=Object.keys(wk).sort().map(key=>{const days=wk[key];const cells=days.map(cell).join('')
      const ex=days.map(dt=>dayMap[isod(dt)]).find(d=>d&&d.extra_checks)
      const exHtml='<div class="cell extra"><div class="dh">Extra checks this week</div><div class="ans">'+esc(ex?ex.extra_checks:'')+'</div></div>'
      return '<section class="week"><div class="wc">Week commencing '+new Date(key+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})+'</div><div class="grid">'+cells+exHtml+'</div></section>'}).join('')
    const css='@page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#1B2438;font-size:10px}.head{display:flex;align-items:center;gap:10px;border-bottom:3px solid #C4A24C;padding-bottom:8px;margin-bottom:10px}.cr{width:40px;height:40px;border-radius:8px;background:#14294D;color:#C4A24C;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:15px}h1{font-family:Georgia,serif;font-size:17px;color:#14294D;margin:0}.sub{color:#6E6A60;font-size:11px}.week{break-inside:avoid;margin-bottom:12px}.wc{background:#14294D;color:#fff;font-weight:700;padding:4px 8px;border-radius:5px;font-size:11px;margin-bottom:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cell{border:1px solid #C9C3B4;border-radius:6px;padding:6px 8px;min-height:74px}.dh{font-weight:700;color:#14294D;border-bottom:1px solid #E8E3D6;padding-bottom:3px;margin-bottom:3px}.dh span{font-weight:400;color:#6E6A60}.q{font-size:8px;color:#6E6A60}.ans{min-height:16px;font-size:9.5px}.temps{font-size:9px;color:#14294D;margin-top:3px}.checks{display:flex;gap:14px;font-size:9px;margin-top:4px}.sign{font-size:9px;margin-top:4px}.safe{font-size:7.5px;color:#9A948A;margin-top:3px;font-style:italic}.catered{font-size:10px;color:#6E6A60;font-style:italic;padding:10px 0}.extra{background:#FAF8F3}.foot{margin-top:6px;color:#9A948A;font-size:8px;text-align:center}'
    const doc='<!doctype html><html><head><meta charset="utf-8"><title>Kitchen Diary '+monthLbl+'</title><style>'+css+'</style></head><body><div class="head"><div class="cr">AJI</div><div><h1>Kitchen Daily Diary — '+monthLbl+'</h1><div class="sub">Al Jamiatul Islamiyah · Bolton Darul Uloom · Safer Food Better Business</div></div></div>'+weeksHtml+'<div class="foot">Printed from Parent Hub · '+new Date().toLocaleDateString('en-GB')+'</div></body></html>'
    const w=window.open('','_blank');if(!w){fire('Allow pop-ups to print the diary');return}
    w.document.write(doc);w.document.close();w.focus();setTimeout(()=>{try{w.print()}catch(e){}},500)}
  const Check=(title,s,setS,which)=>html`<div class="card" style=${{padding:'12px 14px',marginBottom:10}}>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}><b>${title}</b>${day&&day[(which==='daily_open'?'open':'close')+'_by_name']?html`<span class="muted" style=${{fontSize:10}}>✓ ${day[(which==='daily_open'?'open':'close')+'_by_name']}</span>`:''}</div>
    <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
      <div style=${{flex:1,minWidth:120}}><div class="lb" style=${{fontSize:11,fontWeight:700,marginBottom:3}}>Fridge °C</div><input class="in" type="number" step="0.1" value=${s.fridge} onInput=${e=>setS({...s,fridge:e.target.value})}/>${(()=>{const t=fridgeTag(s.fridge);return t?html`<span class="tag" style=${{background:t.bg,color:t.fg,marginTop:4,display:'inline-block'}}>${t.l}</span>`:''})()}</div>

    <textarea class="in" style=${{marginTop:8,minHeight:46,fontFamily:'inherit'}} placeholder="Any problems or changes — what did you do?" value=${s.notes} onInput=${e=>setS({...s,notes:e.target.value})}></textarea>

  return html`<div>
    <div style=${{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:10}}>

        <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginTop:8}}>

  const fire=m=>{setToast(m);setTimeout(()=>setToast(''),3200)}
  async function runReport(){setBusy('rep');const {data,error}=await sb.functions.invoke('data-admin',{body:{action:'retention_report'}});setBusy('');if(error||(data&&data.error)){fire((data&&data.error)||'Error');return}setRep(data.report||[])}

  async function purge(){const n=(rep||[]).filter(r=>r.mode==='auto').reduce((s,r)=>s+(r.due||0),0)
    if(!window.confirm('Permanently delete '+n+' routine record(s) past their retention period — attendance, boarding and supervisor checks over 3 years?\n\nSafeguarding, medical, behaviour and accident records are never deleted here.'))return
    setBusy('purge');const {data,error}=await sb.functions.invoke('data-admin',{body:{action:'retention_purge',confirm:true}});setBusy('')

  useEffect(()=>{runReport()},[])
  const tagFor=m=>m==='auto'?{t:'Auto-delete',bg:C.green,fg:'#fff'}:m==='manual'?{t:'On request',bg:C.goldSoft,fg:C.navy}:{t:'Review only',bg:'#EEF',fg:C.navy}
  const canPurge=(rep||[]).some(r=>r.mode==='auto'&&r.due>0)
  return html`<div>
    <h2 class="serif" style=${{color:C.navy,margin:'2px 0 2px'}}>Data protection</h2>
    <p class="muted" style=${{fontSize:12,marginTop:0}}>Retention monitoring and the access log for sensitive records. Leadership / DPO only.</p>
    <div class="card" style=${{padding:'12px 14px',marginBottom:12}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><b>Data retention</b>
        <button class="chip" onClick=${runReport} disabled=${busy==='rep'}>${busy==='rep'?'Checking…':'Re-check'}</button></div>
      ${rep===null?html`<div class="muted">Loading…</div>`:html`<div>

function Composer({groups,groupSize,onSent}){
  const [title,setTitle]=useState('');const [body,setBody]=useState('');const [priority,setPriority]=useState('normal')
  const [picked,setPicked]=useState([]);const [busy,setBusy]=useState(false);const [files,setFiles]=useState([]);const fileRef=React.useRef(null)
  const toggle=id=>setPicked(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id])
  const reach=(()=>{const ch=groups.filter(g=>picked.includes(g.id));if(ch.some(g=>g.kind==='all')){const a=groups.find(g=>g.kind==='all');return a?groupSize(a):0}return ch.reduce((s,g)=>s+groupSize(g),0)})()
  async function publish(){if(!title||!picked.length)return;setBusy(true)
    let atts=[]
    for(const f of files){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_')
      const path='announcements/'+((crypto.randomUUID&&crypto.randomUUID())||Date.now())+'-'+safe
      const {error:ue}=await sb.storage.from('attachments').upload(path,f,{contentType:f.type||'application/octet-stream'})
      if(ue){setBusy(false);onSent('Upload failed: '+ue.message);return}
      atts.push({path,name:f.name,type:f.type})}
    const {data,error}=await sb.functions.invoke('send-announcement',{body:{mode:'publish',title,message:body,priority,group_ids:picked,attachments:atts}})
    setBusy(false)
    if(error){onSent('Error: '+error.message);return}
    setTitle('');setBody('');setPicked([]);setPriority('normal');setFiles([])
    onSent(`Posted · ${data.pushed} push to ${data.recipients} parents`+(data.email_ready?` · ${data.emailed} emailed`:' · email pending sender')+(atts.length?` · ${atts.length} file(s)`:''))}
  return html`<div>
    <h2 class="serif" style=${{color:C.navy,marginTop:4}}>New announcement</h2>
    <div class="lbl" style=${{marginTop:10}}>Title</div><input class="in" value=${title} onInput=${e=>setTitle(e.target.value)} placeholder="e.g. Half-term closure"/>
    <div class="lbl" style=${{marginTop:12}}>Message</div><textarea class="in" rows="3" value=${body} onInput=${e=>setBody(e.target.value)} placeholder="Write your message to parents…"></textarea>
    <div class="lbl" style=${{marginTop:12}}>Priority</div>
    <div style=${{display:'flex',gap:8,marginTop:6}}>${Object.entries(PRIORITY).map(([k,p])=>html`<button key=${k} class="chip"
      style=${{flex:1,...(priority===k?{background:k==='urgent'?C.urgent:k==='important'?C.gold:C.navy,color:'#fff',borderColor:'transparent'}:{})}} onClick=${()=>setPriority(k)}>${p.label}</button>`)}</div>
    <div class="lbl" style=${{marginTop:12}}>Send to</div>
    <div style=${{display:'flex',flexWrap:'wrap',gap:8,marginTop:6}}>${groups.map(g=>html`<button key=${g.id} class="chip ${picked.includes(g.id)?'on':''}" onClick=${()=>toggle(g.id)}>${g.name} <b style=${{color:picked.includes(g.id)?C.goldSoft:C.muted}}>${groupSize(g)}</b></button>`)}</div>
    <div class="lbl" style=${{marginTop:12}}>Attachments</div>
    <input ref=${fileRef} type="file" multiple accept=".pdf,.doc,.docx,image/*,video/*" style=${{display:'none'}} onChange=${e=>{setFiles(f=>[...f,...Array.from(e.target.files)]);e.target.value=''}}/>
    <button class="btn ghost" style=${{marginTop:6}} onClick=${()=>fileRef.current&&fileRef.current.click()}>📎 Add PDF, Word, image or video</button>
    <div>${files.map((f,i)=>html`<span key=${i} class="chip" style=${{marginTop:6,marginRight:6,display:'inline-block'}}>📎 ${f.name} <span style=${{cursor:'pointer',fontWeight:700}} onClick=${()=>setFiles(x=>x.filter((_,j)=>j!==i))}> ✕</span></span>`)}</div>
    <div class="card" style=${{background:C.navy,color:'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 16px',marginTop:16,border:'none'}}>
      <div><div style=${{fontSize:11,color:'#AEBAD0'}}>Will reach</div><div class="serif" style=${{fontSize:18,fontWeight:700}}>${reach} pupils' parents</div></div>
      <button class="btn gold" style=${{width:'auto'}} disabled=${busy||!title||!picked.length} onClick=${publish}>${busy?'Sending…':'Publish'}</button></div>
    <div class="muted" style=${{fontSize:11,marginTop:8}}>Push to everyone instantly · email only for parents without the app, or for Urgent notices.</div>
  </div>`}

function fmtTime(t){try{return new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(_){return ''}}

function Thread({conversationId,isStaff,onBack,newParentId}){
  const [cid,setCid]=useState(conversationId)
  const [msgs,setMsgs]=useState([]);const [text,setText]=useState('');const [busy,setBusy]=useState(false)
  const [file,setFile]=useState(null);const [urls,setUrls]=useState({})
  const box=React.useRef(null);const fileRef=React.useRef(null)
  useEffect(()=>setCid(conversationId),[conversationId])
  async function load(id){const c=id||cid;if(!c){setMsgs([]);return}
    const {data}=await sb.from('messages').select('*').eq('conversation_id',c).order('created_at');setMsgs(data||[])}
  useEffect(()=>{load()
    if(!cid)return
    const ch=sb.channel('t'+cid).on('postgres_changes',{event:'INSERT',schema:'parent_hub',table:'messages',filter:'conversation_id=eq.'+cid},p=>setMsgs(m=>m.some(x=>x.id===p.new.id)?m:[...m,p.new])).subscribe()
    return ()=>sb.removeChannel(ch)},[cid])
  useEffect(()=>{if(box.current)box.current.scrollTop=box.current.scrollHeight},[msgs])
  useEffect(()=>{msgs.forEach(async m=>{if(m.attachment_path&&!urls[m.attachment_path]){
    const {data}=await sb.storage.from('attachments').createSignedUrl(m.attachment_path,3600)
    if(data&&data.signedUrl)setUrls(u=>({...u,[m.attachment_path]:data.signedUrl}))}})},[msgs])
  async function send(){const b=text.trim();if(!b&&!file)return;setBusy(true)
    let ap=null,an=null,at=null
    if(file){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_')
      const path=(cid||'new')+'/'+((crypto.randomUUID&&crypto.randomUUID())||Date.now())+'-'+safe
      const {error:upErr}=await sb.storage.from('attachments').upload(path,file,{contentType:file.type||'application/octet-stream'})
      if(upErr){setBusy(false);alert('Upload failed: '+upErr.message);return}
      ap=path;an=file.name;at=file.type}
    setText('');setFile(null)
    const {data,error}=await sb.functions.invoke('send-message',{body:{...(cid?{conversation_id:cid}:{}),...(!cid&&newParentId?{parent_id:newParentId}:{}),body:b,attachment_path:ap,attachment_name:an,attachment_type:at}})
    setBusy(false)
    if(error){setText(b);return}
    if(!cid&&data&&data.conversation_id){setCid(data.conversation_id);load(data.conversation_id)}else load()}
  function att(m){if(!m.attachment_path)return null
    const url=urls[m.attachment_path];const isImg=(m.attachment_type||'').startsWith('image/')
    if(isImg)return html`<div style=${{marginTop:6}}>${url?html`<a href=${url} target="_blank"><img src=${url} style=${{maxWidth:'100%',borderRadius:8}}/></a>`:html`<span style=${{fontSize:12,opacity:.7}}>loading image…</span>`}</div>`
    return html`<a href=${url||'#'} target="_blank" style=${{display:'inline-flex',gap:6,alignItems:'center',marginTop:6,fontSize:13,textDecoration:'underline',color:'inherit'}}>📎 ${m.attachment_name||'file'}</a>`}
  async function del(id){if(!confirm('Delete this message? This cannot be undone.'))return;const {error}=await sb.from('messages').delete().eq('id',id);if(error){alert('Could not delete: '+error.message);return}load()}
  return html`<div style=${{display:'flex',flexDirection:'column',height:'68vh'}}>
    ${onBack&&html`<button class="chip" style=${{alignSelf:'flex-start',marginBottom:8}} onClick=${onBack}>← Back to inbox</button>`}
    <div ref=${box} style=${{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:8,padding:'4px 2px'}}>
      ${msgs.length===0&&html`<div class="muted" style=${{textAlign:'center',marginTop:24}}>No messages yet.</div>`}
      ${msgs.map(m=>{const mine=((m.sender_role==='staff')===isStaff)
        return html`<div key=${m.id} style=${{alignSelf:mine?'flex-end':'flex-start',maxWidth:'82%'}}>
          <div style=${{background:mine?C.navy:'#fff',color:mine?'#fff':C.ink,border:mine?'none':'1px solid '+C.line,borderRadius:14,padding:'8px 12px',fontSize:14,whiteSpace:'pre-wrap'}}>${m.body}${att(m)}</div>
          <div class="muted" style=${{fontSize:10,marginTop:2,textAlign:mine?'right':'left'}}>${m.sender_role==='staff'?'School':'Parent'} · ${fmtTime(m.created_at)}${isStaff&&m.sender_role==='staff'?html` · <span style=${{cursor:'pointer',textDecoration:'underline',color:C.urgent}} onClick=${()=>del(m.id)}>Delete</span>`:''}</div></div>`})}
    </div>
    ${file&&html`<div class="chip" style=${{alignSelf:'flex-start',margin:'6px 0'}}>📎 ${file.name} <span style=${{cursor:'pointer',fontWeight:700}} onClick=${()=>setFile(null)}> ✕</span></div>`}
    <div style=${{display:'flex',gap:8,marginTop:8,alignItems:'center'}}>
      <input ref=${fileRef} type="file" style=${{display:'none'}} onChange=${e=>setFile(e.target.files[0]||null)}/>
      <button class="btn ghost" style=${{width:'auto',padding:'10px 13px'}} onClick=${()=>fileRef.current&&fileRef.current.click()}>📎</button>
      <input class="in" style=${{marginTop:0}} value=${text} onInput=${e=>setText(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&send()} placeholder="Type a message…"/>
      <button class="btn" style=${{width:'auto'}} disabled=${busy||(!text.trim()&&!file)} onClick=${send}>${busy?'…':'Send'}</button></div>
  </div>`}

function Inbox(){
  const [convs,setConvs]=useState(null);const [names,setNames]=useState({});const [open,setOpen]=useState(null)
  const [compose,setCompose]=useState(false);const [parents,setParents]=useState(null);const [kids,setKids]=useState({});const [psearch,setPsearch]=useState('');const [picked,setPicked]=useState(null)

  async function loadParents(){const {data:ps}=await sb.from('profiles').select('id,full_name').eq('role','parent').order('full_name');setParents(ps||[])

function WeeklyMarks({profile}){
  const [week,setWeek]=useState('')
  const [raw,setRaw]=useState('')
  const [preview,setPreview]=useState(null)
  const [sentInfo,setSentInfo]=useState(null)
  const [busy,setBusy]=useState(false);const [toast,setToast]=useState('')
  const fire=m=>{setToast(m);setTimeout(()=>setToast(''),4200)}
  const BAD=/^(class\s*average|average|total|mean|student\s*name)\b/i
  function parseRows(){
    return raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
      const m=line.match(/^(.*?)[\s,;\t]+(-?\d+(?:\.\d+)?)\s*$/)
      if(!m)return null
      const name=m[1].trim().replace(/[,;\t]+$/,'').trim()
      if(!name||BAD.test(name))return null
      return {name,mark:Number(m[2])}
    }).filter(r=>r&&!isNaN(r.mark))
  }
  const rows=parseRows()
  function changed(fn){return e=>{fn(e.target.value);setPreview(null);setSentInfo(null)}}
  async function doPreview(){if(!rows.length){fire('Paste some marks first');return}setBusy(true);setSentInfo(null)
    const {data,error}=await sb.functions.invoke('send-exam-marks',{body:{week_label:week,rows,dry_run:true}})
    setBusy(false);if(error||(data&&data.error)){fire((data&&data.error)||'Error');return}setPreview(data)}
  async function doSend(){if(!preview)return
    if(!window.confirm('Send '+preview.matched+' mark'+(preview.matched===1?'':'s')+' to parents now?\n\nThis emails each boy’s parent(s) and cannot be undone.'))return
    setBusy(true);const {data,error}=await sb.functions.invoke('send-exam-marks',{body:{week_label:week,rows,dry_run:false}})
    setBusy(false);if(error||(data&&data.error)){fire((data&&data.error)||'Error sending');return}
    setSentInfo(data);setPreview(null);fire('Sent '+data.sent+' email'+(data.sent===1?'':'s'))}
  return html`<div>
    <h2 class="serif" style=${{color:C.navy,marginTop:4}}>Weekly exam marks</h2>
    <p class="muted" style=${{fontSize:12,marginTop:0,lineHeight:1.5}}>Paste one pupil per line — name then the mark (e.g. copy the Name and mark columns straight from your sheet). Preview first to check the matches, then send. Each boy’s parent(s) get the mark out of 10 with the class average and praise, from Muallim Luqmān Amla.</p>
    <div class="card" style=${{padding:14,marginBottom:12}}>
      <div class="lbl">Week <span class="muted" style=${{fontWeight:400}}>(optional, for your reference)</span></div>
      <input class="in" placeholder="e.g. Week 5" value=${week} onInput=${changed(setWeek)}/>
      <div class="lbl" style=${{marginTop:12}}>Marks</div>
      <textarea class="in" style=${{minHeight:150,resize:'vertical',fontFamily:'ui-monospace,Menlo,Consolas,monospace',fontSize:13,whiteSpace:'pre'}} placeholder=${"Abdullah Chaudhry   8\nAbu Bakr Amla   9\nAshir Khan   6\n…"} value=${raw} onInput=${changed(setRaw)}></textarea>
      <div class="muted" style=${{fontSize:12,marginTop:6}}>${rows.length} mark${rows.length===1?'':'s'} detected${rows.length?' · average '+(rows.reduce((s,r)=>s+r.mark,0)/rows.length).toFixed(1):''}. Summary rows like “Class average” are ignored.</div>
      <button class="btn" style=${{marginTop:12}} disabled=${busy||!rows.length} onClick=${doPreview}>${busy&&!preview?'Checking…':'Preview matches'}</button>
    </div>

    ${preview&&html`<div class="card" style=${{padding:14,marginBottom:12,border:'1px solid '+C.gold}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
        <b class="serif" style=${{color:C.navy,fontSize:16}}>Preview — nothing sent yet</b>
        <span class="tag" style=${{background:C.navy,color:'#fff',padding:'4px 10px'}}>Class average ${preview.class_average} / 10</span>
      </div>
      <div class="muted" style=${{fontSize:12,margin:'6px 0 10px'}}>${preview.matched} matched to a parent${preview.unmatched&&preview.unmatched.length?' · '+preview.unmatched.length+' unmatched':''}${preview.no_parent&&preview.no_parent.length?' · '+preview.no_parent.length+' with no parent email':''}</div>
      ${preview.unmatched&&preview.unmatched.length>0&&html`<div class="card" style=${{padding:'8px 11px',marginBottom:8,background:C.urgentSoft,border:'1px solid '+C.urgent}}><b style=${{color:C.urgent,fontSize:12}}>Not matched (won’t be sent):</b> <span style=${{fontSize:12}}>${preview.unmatched.join(', ')}</span></div>`}
      ${preview.no_parent&&preview.no_parent.length>0&&html`<div class="card" style=${{padding:'8px 11px',marginBottom:8,background:'#FBECC9',border:'1px solid #E3C97E'}}><b style=${{color:'#8A6D1B',fontSize:12}}>No parent email (won’t be sent):</b> <span style=${{fontSize:12}}>${preview.no_parent.join(', ')}</span></div>`}
      <div style=${{maxHeight:230,overflow:'auto',border:'1px solid '+C.line,borderRadius:10}}>
        ${(preview.preview||[]).map((r,i)=>html`<div key=${i} style=${{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 11px',borderTop:i?'1px solid #F2EFE6':'none'}}>
          <span style=${{fontSize:13}}>${r.name}</span>
          <span style=${{display:'flex',gap:10,alignItems:'center'}}><b style=${{color:C.navy}}>${r.mark}/10</b><span class="muted" style=${{fontSize:11}}>${(r.to||[]).length} recipient${(r.to||[]).length===1?'':'s'}</span></span>
        </div>`)}
      </div>
      <button class="btn" style=${{marginTop:12,background:C.green}} disabled=${busy||!preview.matched} onClick=${doSend}>${busy?'Sending…':'✓ Send '+preview.matched+' to parents'}</button>
      <div class="muted" style=${{fontSize:11,marginTop:6,textAlign:'center'}}>This cannot be undone.</div>
    </div>`}

    ${sentInfo&&html`<div class="card" style=${{padding:14,marginBottom:12,background:'#E5EEE7',border:'1px solid '+C.green}}>
      <b style=${{color:C.green}}>✓ Sent ${sentInfo.sent} email${sentInfo.sent===1?'':'s'} to parents.</b>

    </div>`}
    ${toast&&html`<div style=${{position:'fixed',left:'50%',bottom:24,transform:'translateX(-50%)',background:'#0E1D38',color:'#fff',padding:'10px 16px',borderRadius:999,fontSize:14,maxWidth:'90%',textAlign:'center'}}>${toast}</div>`}
  </div>`}

  const withNum=pupils.filter(p=>(p.contacts||[]).length).length
  const sani=m=>'tel:'+(m||'').replace(/[^\d+]/g,'')
  function startEdit(c){setEdit('c-'+c.id);setDraft({id:c.id,label:c.label||'',name:c.name||'',mobile:c.mobile||''})}
  function startAdd(p){const par=(p.parents||[])[0];setEdit('new-'+p.pupil_id);setDraft({id:null,parent_id:par?par.id:'',label:'',name:'',mobile:'',parents:p.parents||[]})}
  function cancel(){setEdit(null);setDraft({})}
  async function save(){if(!(draft.mobile||'').trim()){fire('Enter a number');return}
    if(!draft.id&&!draft.parent_id){fire('No parent linked to attach this to');return}
    setBusy(true);const {data:r,error}=await sb.functions.invoke('user-admin',{body:{action:'contact_save',id:draft.id||undefined,parent_id:draft.parent_id,label:draft.label,name:draft.name,mobile:draft.mobile}})
    setBusy(false);if(error||(r&&r.error)){fire((r&&r.error)||'Error saving');return}fire('Saved');cancel();load()}
  async function del(){if(!draft.id)return;if(!window.confirm('Remove this number?'))return
    setBusy(true);const {data:r,error}=await sb.functions.invoke('user-admin',{body:{action:'contact_delete',id:draft.id}});setBusy(false)
    if(error||(r&&r.error)){fire((r&&r.error)||'Error');return}fire('Removed');cancel();load()}
  const form=()=>html`<div class="card" style=${{padding:10,marginTop:6,background:'#FAF8F3',border:'1px solid '+C.gold}}>
    <div style=${{display:'flex',gap:6,flexWrap:'wrap'}}>
      <input class="in" style=${{flex:'1 1 110px',marginTop:0}} placeholder="Label (e.g. Father)" value=${draft.label} onInput=${e=>setDraft(d=>({...d,label:e.target.value}))}/>
      <input class="in" style=${{flex:'2 1 150px',marginTop:0}} placeholder="Name (optional)" value=${draft.name} onInput=${e=>setDraft(d=>({...d,name:e.target.value}))}/>
    </div>
    <input class="in" type="tel" style=${{marginTop:6}} placeholder="Mobile number" value=${draft.mobile} onInput=${e=>setDraft(d=>({...d,mobile:e.target.value}))}/>
    ${!draft.id&&(draft.parents||[]).length>1&&html`<select class="in" style=${{marginTop:6}} value=${draft.parent_id} onChange=${e=>setDraft(d=>({...d,parent_id:e.target.value}))}>${(draft.parents||[]).map(pp=>html`<option key=${pp.id} value=${pp.id}>Save under ${pp.name||'parent'}</option>`)}</select>`}
    <div style=${{display:'flex',gap:8,marginTop:8}}>
      <button class="btn" style=${{flex:1}} disabled=${busy} onClick=${save}>${busy?'Saving…':'Save'}</button>
      ${draft.id?html`<button class="chip" style=${{color:C.urgent}} disabled=${busy} onClick=${del}>Remove</button>`:''}
      <button class="chip" disabled=${busy} onClick=${cancel}>Cancel</button>
    </div>
  </div>`
  return html`<div>
    <h2 class="serif" style=${{color:C.navy,marginTop:4}}>Parent contacts</h2>
    <p class="muted" style=${{fontSize:12,marginTop:0,lineHeight:1.5}}>Tap a number to call it straight from your phone — no copying needed. Tap ✏️ to correct a number, name or label, or ＋ Add to add one.</p>
    <input class="in" style=${{marginTop:0}} placeholder="Search pupil, parent or number…" value=${q} onInput=${e=>setQ(e.target.value)}/>
    ${data&&html`<div class="muted" style=${{fontSize:12,margin:'8px 2px'}}>${pupils.length} pupils · ${withNum} with a number on file${ql?` · ${filtered.length} match`:''}</div>`}
    ${data===null&&html`<div class="muted">Loading…</div>`}
    ${filtered.map(p=>html`<div key=${p.pupil_id} class="card" style=${{padding:'10px 12px',marginBottom:8}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
        <div><b>${p.name}</b>${p.year?html`<span class="muted" style=${{fontSize:11,marginLeft:6}}>${p.year}</span>`:''}</div>
        ${edit==='new-'+p.pupil_id?'':html`<button class="chip" onClick=${()=>startAdd(p)}>＋ Add</button>`}
      </div>
      ${(p.contacts||[]).length===0&&edit!=='new-'+p.pupil_id?html`<div class="muted" style=${{fontSize:12,marginTop:4}}>No number on file.</div>`:''}
      ${(p.contacts||[]).map((c,i)=> edit==='c-'+c.id
        ? html`<div key=${c.id}>${form()}</div>`
        : html`<div key=${c.id||i} style=${{display:'flex',gap:6,alignItems:'stretch',marginTop:6}}>
            <a href=${sani(c.mobile)} style=${{flex:1,minWidth:0,display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,padding:'10px 12px',border:'1px solid '+C.line,borderRadius:12,textDecoration:'none',color:C.ink}}>
              <span style=${{minWidth:0}}><b style=${{color:C.navy,fontSize:15,letterSpacing:'.2px'}}>${c.mobile}</b><div class="muted" style=${{fontSize:11,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${[c.label,c.name||c.parent_name].filter(Boolean).join(' · ')}${c.primary?' · preferred':''}</div></span>
              <span style=${{flexShrink:0,background:C.green,color:'#fff',borderRadius:999,padding:'7px 14px',fontSize:13,fontWeight:700}}>📞 Call</span>
            </a>
            <button class="chip" style=${{alignSelf:'center'}} onClick=${()=>startEdit(c)}>✏️</button>
          </div>`)}
      ${edit==='new-'+p.pupil_id?form():''}
    </div>`)}
    ${data&&filtered.length===0&&html`<div class="card muted" style=${{padding:16}}>No match.</div>`}
    ${toast&&html`<div style=${{position:'fixed',left:'50%',bottom:24,transform:'translateX(-50%)',background:'#0E1D38',color:'#fff',padding:'10px 16px',borderRadius:999,fontSize:14,maxWidth:'90%',textAlign:'center'}}>${toast}</div>`}
  </div>`}

function App(){
  const [session,setSession]=useState(undefined);const [profile,setProfile]=useState(null);const [recovery,setRecovery]=useState(false)
  useEffect(()=>{
    const q=new URLSearchParams(window.location.search);const th=q.get('token_hash');const ty=q.get('type')
    if(th&&ty==='recovery'){sb.auth.verifyOtp({type:'recovery',token_hash:th}).then(({error})=>{try{history.replaceState(null,'',window.location.pathname)}catch(e){}if(!error)setRecovery(true)})}
    sb.auth.getSession().then(({data})=>setSession(data.session));const {data:sub}=sb.auth.onAuthStateChange((e,s)=>{if(e==='PASSWORD_RECOVERY')setRecovery(true);setSession(s)});return()=>sub.subscription.unsubscribe()},[])
  useEffect(()=>{if(session&&session.user)sb.from('profiles').select('*').eq('id',session.user.id).single().then(({data})=>setProfile(data));else setProfile(null)},[session])
  if(recovery)return html`<${ResetPassword} onDone=${()=>setRecovery(false)}/>`
  if(session===undefined)return html`<div class="center muted">Loading…</div>`
  if(!session)return html`<${Login}/>`
  if(profile===null)return html`<div class="center muted">Loading…</div>`
  if(profile.is_active===false)return html`<div class="center" style=${{textAlign:'center',padding:24,maxWidth:360,margin:'0 auto'}}><div class="serif" style=${{color:C.navy,fontSize:20,marginBottom:8}}>Account deactivated</div><p class="muted" style=${{fontSize:14,lineHeight:1.5}}>Your access to the Parent Hub has been removed. If you think this is a mistake, please contact the school office.</p><button class="btn" style=${{marginTop:14,width:'auto'}} onClick=${()=>sb.auth.signOut()}>Sign out</button></div>`
  if(profile.role==='admin'||profile.role==='staff')return html`<${Dashboard} profile=${profile} onSignOut=${()=>sb.auth.signOut()}/>`
  return html`<${ParentApp} profile=${profile} onSignOut=${()=>sb.auth.signOut()}/>`}
createRoot(document.getElementById('root')).render(html`<${App}/>`)
</script>
</body>
</html>
